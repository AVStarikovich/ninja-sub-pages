{
  "allow-lan": false,
  "mode": "rule",
  "log-level": "info",
  "ipv6": false,
  "profile": {
    "store-selected": true,
    "store-fake-ip": true
  },
  "dns": {
    "enable": true,
    "enhanced-mode": "fake-ip",
    "listen": "127.0.0.1:1053",
    "ipv6": false,
    "fake-ip-filter": [
      "+.lan",
      "+.local",
      "localhost",
      "+.home.arpa"
    ],
    "nameserver": [
      "114.114.114.114",
      "8.8.8.8"
    ],
    "default-nameserver": [
      "8.8.8.8"
    ]
  },
  "rules": [
    "DOMAIN-SUFFIX,rvision.ru,DIRECT",
    "DOMAIN-SUFFIX,rvision.pro,DIRECT",
    "DOMAIN-SUFFIX,rvision.local,DIRECT",
    "DOMAIN-SUFFIX,yandex.ru,DIRECT",
